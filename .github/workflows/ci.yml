name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify
        run: make verify
      - name: Validate observability and deployment configuration
        run: make observability && make validate-deploy
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build container
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: false
          tags: nimbus:${{ github.sha }}

  postgres-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
        env:
          POSTGRES_DB: nimbus_test
          POSTGRES_USER: nimbus
          POSTGRES_PASSWORD: nimbus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nimbus -d nimbus_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Provision runtime roles
        run: |
          PGPASSWORD=nimbus psql -h localhost -U nimbus -d nimbus_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE nimbus_owner LOGIN PASSWORD 'nimbus-owner-test';
          CREATE ROLE nimbus_api LOGIN PASSWORD 'nimbus-api-test';
          CREATE ROLE nimbus_worker LOGIN PASSWORD 'nimbus-worker-test';
          ALTER DATABASE nimbus_test OWNER TO nimbus_owner;
          SQL
      - name: Test PostgreSQL migrations
        run: make test-integration
        env:
          NIMBUS_TEST_DATABASE_URL: postgres://nimbus_owner:nimbus-owner-test@localhost:5432/nimbus_test?sslmode=disable
          NIMBUS_TEST_API_DATABASE_URL: postgres://nimbus_api:nimbus-api-test@localhost:5432/nimbus_test?sslmode=disable
          NIMBUS_TEST_WORKER_DATABASE_URL: postgres://nimbus_worker:nimbus-worker-test@localhost:5432/nimbus_test?sslmode=disable
      - name: Run Gherkin acceptance scenarios
        run: make test-acceptance
        env:
          NIMBUS_ACCEPTANCE_FORMAT: pretty
          NIMBUS_TEST_DATABASE_URL: postgres://nimbus_owner:nimbus-owner-test@localhost:5432/nimbus_test?sslmode=disable
          NIMBUS_TEST_API_DATABASE_URL: postgres://nimbus_api:nimbus-api-test@localhost:5432/nimbus_test?sslmode=disable
          NIMBUS_TEST_WORKER_DATABASE_URL: postgres://nimbus_worker:nimbus-worker-test@localhost:5432/nimbus_test?sslmode=disable

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: make web-install
      - name: Verify contract, types, lint and integration scenarios
        run: make web-verify
      - name: Build
        run: make web-build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [verify, web]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start split stack
        run: make dev-split
      - name: Smoke test the deployment
        run: make test-smoke
        env:
          NIMBUS_BASE_URL: http://127.0.0.1:8080
      - name: Install browsers
        run: make web-install && npx --prefix web playwright install --with-deps chromium
      - name: Browser journeys
        run: make e2e
        env:
          CI: "true"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
      - name: Service logs
        if: failure()
        run: docker compose -f compose.yaml -f compose.split.yaml logs --no-color nimbus-api nimbus-worker | tail -n 300
