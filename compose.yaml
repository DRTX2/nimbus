name: nimbus

services:
  postgres:
    image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    environment:
      POSTGRES_DB: nimbus
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus -d nimbus"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nimbus-migrate:
    build:
      context: .
    environment:
      NIMBUS_ENV: development
      NIMBUS_COMPONENT: migrate
      NIMBUS_DATABASE_URL: postgres://nimbus:nimbus@postgres:5432/nimbus?sslmode=disable
      NIMBUS_API_KEY: ${NIMBUS_API_KEY:-nimbus-local-development-key}
      NIMBUS_TENANT_ID: 00000000-0000-0000-0000-000000000001
      NIMBUS_TENANT_NAME: Nimbus Local
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  nimbus:
    build:
      context: .
    environment:
      NIMBUS_ENV: development
      NIMBUS_COMPONENT: all
      NIMBUS_HTTP_ADDRESS: :8080
      NIMBUS_DATABASE_URL: postgres://nimbus:nimbus@postgres:5432/nimbus?sslmode=disable
      NIMBUS_API_KEY: ${NIMBUS_API_KEY:-nimbus-local-development-key}
      NIMBUS_TENANT_ID: 00000000-0000-0000-0000-000000000001
      NIMBUS_TENANT_NAME: Nimbus Local
      NIMBUS_WORKER_COUNT: 2
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      nimbus-migrate:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/observability/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.68.0@sha256:6279882637ae03e70f519965d2ba5ca84cb785f4baf4f0d7237e827a37c33a42
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
    restart: unless-stopped

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
