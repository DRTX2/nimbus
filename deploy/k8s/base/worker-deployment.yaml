apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimbus-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nimbus-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nimbus-worker
    spec:
      serviceAccountName: nimbus
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/replace-me/nimbus:sha-replace-me
          envFrom:
            - configMapRef: {name: nimbus-config}
            - secretRef: {name: nimbus-secrets}
          env:
            - name: NIMBUS_COMPONENT
              value: worker
            - name: NIMBUS_HTTP_ADDRESS
              value: :8081
          ports:
            - {name: metrics, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /health/ready, port: metrics}
          livenessProbe:
            httpGet: {path: /health/live, port: metrics}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
