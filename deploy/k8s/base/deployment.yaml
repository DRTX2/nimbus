apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimbus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nimbus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nimbus
    spec:
      serviceAccountName: nimbus
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nimbus
          image: ghcr.io/replace-me/nimbus:sha-replace-me
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nimbus-config
            - secretRef:
                name: nimbus-secrets
          env:
            - name: NIMBUS_COMPONENT
              value: api
            - name: NIMBUS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nimbus-secrets
                  key: NIMBUS_API_DATABASE_URL
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
