# Example only. Do not commit real values or include this file in kustomization.
apiVersion: v1
kind: Secret
metadata:
  name: nimbus-secrets
  namespace: nimbus
type: Opaque
stringData:
  NIMBUS_API_KEY: replace-with-at-least-32-random-characters
  NIMBUS_API_DATABASE_URL: postgres://nimbus_api:replace-me@postgres.example:5432/nimbus?sslmode=require
  NIMBUS_WORKER_DATABASE_URL: postgres://nimbus_worker:replace-me@postgres.example:5432/nimbus?sslmode=require
  NIMBUS_MIGRATOR_DATABASE_URL: postgres://nimbus_owner:replace-me@postgres.example:5432/nimbus?sslmode=require
  NIMBUS_AWS_EXTERNAL_IDS: '{"aws-external-id/acme-prod":"replace-with-customer-generated-external-id"}'
